async function deleteLog(meetingId) {
  if (!confirm('この過去ログを削除しますか？\n関連するアクションも削除されます。')) return;
  delete state.meetings[meetingId];
  state.actions = state.actions.filter(a => a.meetingId !== meetingId);
  renderAll();
  await saveState();
}

}
async function confirmEditLog(meetingId) {
  const m = state.meetings[meetingId];
  if (!m) return;
  const title = document.getElementById('edit-log-title').value.trim();
  const date = document.getElementById('edit-log-date').value;
  if (!title) { alert('タイトルを入力してください'); return; }
  m.title = title;
  if (date) m.date = date;
  closeModal();
  renderAll();
  await saveState();
}

// ============================================================
// 自動同期（2段階ポーリング）
//   ping（バージョン番号のみ）で変更を検知 → 変更時のみフルデータ取得
// ============================================================
const POLL_INTERVAL_MS = 10000;
let pollTimer = null;
let lastSyncedJson = null;
let lastKnownVersion = null;
let isSyncing = false;
let pendingRender = false;

function setSyncStatus(status, text) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if (!dot || !label) return;
  dot.className = 'sync-dot ' + (status || '');
  label.textContent = text;
}
function isUserTyping() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = el.tagName.toLowerCase();
  return tag === 'textarea' || tag === 'input' || el.isContentEditable;
}
function formatSyncTime() {
  const now = new Date();
  return now.getHours().toString().padStart(2,'0') + ':' +
         now.getMinutes().toString().padStart(2,'0') + ':' +
         now.getSeconds().toString().padStart(2,'0');
}
// ① 軽量ping: バージョン番号だけ取得して変更を検知
async function pingSync() {
  if (isSyncing || pendingSaves > 0) return;
  // 未接続状態なら復帰を試みる
  if (readOnly || !state) {
    const ok = await loadState();
    if (ok) { renderAll(); setSyncStatus('updated', '再接続しました ' + formatSyncTime()); }
    return;
  }
  try {
    const r = await gasFetch(GAS_URL + '?action=ping&t=' + Date.now(), { mode: 'cors' }, 12000);
    if (!r || !r.ok) { setSyncStatus('error', '接続確認に失敗 — 自動で再試行します'); return; }
    lastKnownVersion = r.version;
    if (r.version !== stateVersion) {
      await fetchFullData();
    } else {
      setSyncStatus('', '最終確認: ' + formatSyncTime());
    }
  } catch (e) {
    // ★ ここで絶対にデータを初期化しない
    setSyncStatus('error', '接続エラー — 自動で再試行します');
  }
}
// ② フルデータ取得（バージョンが変わったときのみ）
async function fetchFullData() {
  if (isSyncing) return;
  isSyncing = true;
  setSyncStatus('syncing', '更新を取得中...');
  try {
    const r = await gasGet(2);
    if (!r) { setSyncStatus('error', '取得に失敗しました — 自動で再試行します'); return; }
    if (r.empty || !r.value) {
      // ★ サーバーが空でもサンプルデータで上書きしない
      enterReadOnly('サーバー側のデータが空です');
      return;
    }
    let theirs;
    try { theirs = JSON.parse(r.value); }
    catch (e) { setSyncStatus('error', 'データ形式エラー — 保存は行いません'); return; }

    if (state && eqJson(state, theirs)) {
      stateVersion = r.version;
      baseState = deepCopy(theirs);
      lastSyncedJson = r.value;
      setSyncStatus('', '最終同期: ' + formatSyncTime());
      return;
    }
    // 手元の変更を保持したまま、相手の変更を取り込む
    const merged = state ? threeWayMerge(baseState, state, theirs) : theirs;
    const hasLocalChanges = !eqJson(merged, theirs);
    state          = merged;
    stateVersion   = r.version;
    baseState      = deepCopy(theirs);
    lastSyncedJson = r.value;
    exitReadOnly();

    if (isUserTyping()) {
      pendingRender = true;
      setSyncStatus('updated', '更新あり（入力完了後に反映）');
    } else {
      renderAll();
      setSyncStatus('updated', '最終同期: ' + formatSyncTime() + ' ✓ 更新あり');
      setTimeout(() => { if (!readOnly) setSyncStatus('', '最終同期: ' + formatSyncTime()); }, 3000);
    }
    if (hasLocalChanges) saveState(); // 手元にしかない変更をサーバーへ反映
  } finally {
    isSyncing = false;
  }
}
// 入力完了時に保留中の再描画を実行
document.addEventListener('focusout', () => {
  if (pendingRender && !isUserTyping()) {
    pendingRender = false;
    renderAll();
    if (!readOnly) setSyncStatus('', '最終同期: ' + formatSyncTime());
  }
});
// 手動更新ボタン
async function manualSync() {
  const btn = document.getElementById('sync-refresh-btn');
  if (btn) { btn.classList.add('spinning'); setTimeout(() => btn.classList.remove('spinning'), 600); }
  if (readOnly || !state) {
    const ok = await loadState();
    if (ok) { renderAll(); setSyncStatus('updated', '再接続しました ' + formatSyncTime()); }
    return;
  }
  await fetchFullData();
}
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pingSync, POLL_INTERVAL_MS);
}
// ページ復帰時（スマホでアプリを切り替えた後など）にも同期
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') pingSync();
});
// ============================================================
// モバイル判定・サイドバー除去
// ============================================================
function isMobile() {
  return window.innerWidth <= 880;
}
function removeSidebarOnMobile() {
  if (isMobile()) {
    const sidebar = document.querySelector('.sidebar');
    if (sidebar) sidebar.remove();
    const app = document.querySelector('.app');
    if (app) {
      app.style.display = 'block';
      app.style.gridTemplateColumns = 'unset';
    }
  }
}
// ============================================================
// 初期化
// ============================================================
(async function init() {
  removeSidebarOnMobile();
  setSyncStatus('syncing', 'データを読み込み中...');
  const ok = await loadState();
  if (!ok) {
    renderFatalError();
    startPolling();   // 復帰を待ち続ける
    return;
  }
  if (!isMobile()) {
    const hash = location.hash.replace('#', '');
    const validPages = ['home','quant','qual','meeting','actions','log','signal_admin','member_admin','howto'];
    if (hash && validPages.includes(hash)) currentPage = hash;
  } else {
    currentPage = 'home';
  }
  renderAll();
  setSyncStatus('', '最終同期: ' + formatSyncTime());
  startPolling();
})();
// ブラウザの戻る・進む対応（PCのみ）
window.addEventListener('popstate', () => {
  if (isMobile() || !state) return;
  const hash = location.hash.replace('#', '');
  const validPages = ['home','quant','qual','meeting','actions','log','signal_admin','member_admin','howto'];
  if (hash && validPages.includes(hash)) {
    currentPage = hash;
    renderAll();
    window.scrollTo(0, 0);
  }
});
window.addEventListener('resize', () => {
  removeSidebarOnMobile();
});
</script>
